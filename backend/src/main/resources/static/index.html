<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Farmácias Ruanna</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/extras.css">
</head>
<body class="com-layout" data-pagina="dashboard">
  <main>
    <header class="titulo-pagina">
      <div>
        <h1>Dashboard</h1>
        <p>Visão geral do estoque e alertas em tempo real.</p>
      </div>
      <div class="acoes-topo">
        <a class="btn" href="vendas.html">Nova venda</a>
        <a class="btn sec" href="medicamentos.html">+ Medicamento</a>
        <a class="btn sec" href="estoque.html">Entrada / Saída</a>
      </div>
    </header>

    <p id="erro" class="erro" hidden></p>

    <section id="cartoes" class="cartoes-dash"></section>

    <section class="grade-grafico">
      <article class="caixa">
        <h2>Movimentações — últimos 14 dias</h2>
        <div id="grafico"></div>
        <div class="legenda">
          <span><i style="background: #0e8a4f"></i>Entradas</span>
          <span><i style="background: #d4001a"></i>Saídas</span>
        </div>
      </article>

      <article class="caixa">
        <h2>Alertas importantes</h2>
        <ul id="lista-alertas" class="lista-alertas"></ul>
      </article>
    </section>

    <section class="grade-listas">
      <article class="caixa">
        <div class="caixa-titulo"><h2>Próximos do vencimento</h2></div>
        <ul id="lista-vencimento" class="lista-simples"></ul>
      </article>

      <article class="caixa">
        <div class="caixa-titulo">
          <h2>Últimas entradas</h2>
          <a href="movimentacoes.html?tipo=ENTRADA">Ver todas</a>
        </div>
        <ul id="lista-entradas" class="lista-simples"></ul>
      </article>

      <article class="caixa">
        <div class="caixa-titulo">
          <h2>Últimas saídas</h2>
          <a href="movimentacoes.html?tipo=SAIDA">Ver todas</a>
        </div>
        <ul id="lista-saidas" class="lista-simples"></ul>
      </article>
    </section>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
