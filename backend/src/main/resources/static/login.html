<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | Farmácias Ruanna</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="cartao-login">
      <div class="marca">
        <span class="capsula" aria-hidden="true"></span>
        <div>
          <strong>Farmácias Ruanna</strong>
          <small>A saúde da comunidade</small>
        </div>
      </div>

      <section id="acessos-demo" hidden aria-label="Acessos de demonstração">
        <h1>Conheça o Farmácia Manager</h1>
        <p>Explore os módulos com contas de exemplo. Os dados são fictícios e compartilhados.</p>
        <p id="erro-demo" class="erro" role="alert" hidden></p>
        <button id="demo-admin" type="button">Abrir como administrador</button>
        <button id="demo-vendedor" type="button">Abrir como vendedor</button>
      </section>
      <form id="formulario">
        <label
          >Usuário
          <input
            id="login"
            type="text"
            autocomplete="username"
            autofocus
            required
          />
        </label>

        <label
          >Senha
          <input
            id="senha"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <p id="erro" class="erro" hidden></p>

        <button id="entrar" type="submit">Entrar</button>
      </form>
    </main>

    <script src="js/comum.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
