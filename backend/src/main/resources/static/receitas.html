<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receitas | Farmácia Manager</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/registros.css"></head>
<body class="com-layout" data-pagina="receitas">
<main><header class="topo"><h1>Receitas</h1></header>
<p class="aviso">Exemplo manual sem validade clínica ou fiscal. Não emite prescrição nem recomenda doses.</p>
<p id="erro" class="erro" role="alert" hidden></p><p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>
<form id="formulario" class="registro"><fieldset ><legend>Registrar receita de exemplo</legend><div class="campos"><label class="campo">Cliente fictício<select id="cliente" required></select></label><label class="campo">Prescritor informado<input id="prescritor" type="text" required maxlength="100"></label><label class="campo">Número informado<input id="numero" type="text" required maxlength="80"></label><label class="campo">Emissão<input id="emitida-em" type="date" required></label><label class="campo">Validade até<input id="validade-ate" type="date" required></label><label class="campo">Observações opcionais<textarea id="observacoes" maxlength="2000"></textarea></label></div><div class="campos"><label class="campo">Medicamento<select id="medicamento"></select></label><label class="campo">Quantidade<input id="quantidade" type="number" min="1" max="9999" step="1" value="1"></label></div><button id="adicionar" type="button" class="btn sec">Adicionar item</button><ul id="itens" class="itens" aria-label="Itens da receita"></ul><button class="btn" type="submit">Registrar receita</button></fieldset></form><div class="barra"><label class="campo">Filtrar por cliente<select id="filtro-cliente"></select></label></div><div class="tabela-area"><table><thead><tr><th scope="col">Número</th><th scope="col">Cliente</th><th scope="col">Prescritor</th><th scope="col">Emissão</th><th scope="col">Validade</th><th scope="col">Detalhes</th></tr></thead><tbody id="corpo"></tbody></table></div></main><dialog id="detalhe" class="detalhe" aria-labelledby="titulo-detalhe"><h2 id="titulo-detalhe">Receita</h2><p id="resumo-detalhe"></p><div class="tabela-area"><table><thead><tr><th scope="col">Medicamento</th><th scope="col">Prescrito</th><th scope="col">Dispensado</th><th scope="col">Restante</th><th scope="col">Preço atual</th></tr></thead><tbody id="itens-detalhe"></tbody></table></div><p id="observacoes-detalhe"></p><button id="fechar-detalhe" type="button" class="btn sec">Fechar</button></dialog>
<script src="js/comum.js"></script><script src="js/layout.js"></script><script src="js/registros.js"></script><script src="js/receitas.js"></script>
</body></html>
